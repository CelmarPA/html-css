<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div#cxA {
            /* flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px; */

            flex: 1 0 200px;
        }

        div#cxB {
            /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 200px; */

            flex: 1 1 150px;
        }

        div#cxC {
            /* flex-shrink: 8;
            flex-grow: 1;
            flex-basis: 200px; */

            flex: 1 8 auto;
        }

        /* 
            mesma coisa que nada:
            flex: 0 1 auto;
            flex: initial;
            
            Não flexivel
            flex: 0 0 auto;
            flex: none;
            
            Máximo de flexibilidade
            flex: 1 1 auto;
            flex: auto;

            Mesma coisa que:
            flex: 3;
            flex: 3 1 auto;
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
